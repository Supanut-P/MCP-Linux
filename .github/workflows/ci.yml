name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ubuntu headless verification
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux dependencies and pnpm
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 libsecret-tools ripgrep
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Run Linux headless gates
        run: |
          pnpm rebrand:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:packaging
          pnpm test:release-gate
          pnpm docs:tools:check
          git diff --check

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Verify and publish Linux headless release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify release tag matches package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${{ github.ref_name }}" = "v${version}"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 libsecret-tools ripgrep
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Run release gates
        run: |
          pnpm rebrand:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:release-gate
          pnpm docs:tools:check
          pnpm exec vitest run tests/release/public-repo-hygiene.test.ts tests/packaging/headless-linux-tunnel.test.ts

      - name: Build Linux headless artifacts
        run: pnpm package:linux:headless

      - name: Inspect artifacts
        shell: bash
        run: |
          cd dist
          sha256sum --check Baitonghub-Linux-mcp-0.2.0-SHA256SUMS
          dpkg-deb --contents Baitonghub-Linux-mcp-0.2.0-amd64.deb > deb-contents.txt
          tar -tzf Baitonghub-Linux-mcp-0.2.0-linux-x64.tar.gz > tar-contents.txt
          if grep -Eiq '(^|/)[^/]+\.(exe|cmd|bat|ps1)$|windows-ocr|powershell' deb-contents.txt tar-contents.txt; then
            echo 'Forbidden Windows runtime found in Linux release' >&2
            exit 1
          fi
          grep -q 'baitonghub-linux-mcp-tunnel@.service' deb-contents.txt
          grep -q 'install-linux-tunnel-client.sh' deb-contents.txt
          rm deb-contents.txt tar-contents.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v0.2.0.md
          draft: false
          prerelease: false
          files: |
            dist/Baitonghub-Linux-mcp-0.2.0-amd64.deb
            dist/Baitonghub-Linux-mcp-0.2.0-linux-x64.tar.gz
            dist/Baitonghub-Linux-mcp-0.2.0-SHA256SUMS
